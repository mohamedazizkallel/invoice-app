{% extends "admin/base_site.html" %}

{% block userlinks %}
{% if available_tenants %}
<form method="get" action="{% url 'switch_tenant' %}" style="display:inline; margin-right:15px;">
  <label style="color:#fff; font-size:12px;">Schema:</label>
  <select name="schema" onchange="this.form.submit()" style="font-size:12px; padding:2px 4px;">
    <option value="public" {% if current_schema == 'public' %}selected{% endif %}>public</option>
    {% for t in available_tenants %}
    <option value="{{ t.schema_name }}" {% if current_schema == t.schema_name %}selected{% endif %}>
      {{ t.name }} ({{ t.schema_name }})
    </option>
    {% endfor %}
  </select>
</form>
{% endif %}
{{ block.super }}
{% endblock %}
